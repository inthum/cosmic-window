<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INTHUM · Cosmic Window</title>
  <style>
    :root {
      --bg: #03050a;
      --fg: #dfe9ff;
      --muted: rgba(223, 233, 255, 0.58);
      --panel: rgba(10, 16, 30, 0.32);
      --panel-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 50%, #050913 0%, #03050a 65%, #010205 100%);
      cursor: none;
    }

    .hud {
      position: fixed;
      left: 22px;
      bottom: 20px;
      max-width: min(560px, calc(100vw - 44px));
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      line-height: 1.55;
      user-select: none;
      pointer-events: none;
    }

    .hud strong {
      display: block;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .hud span {
      display: block;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .hint {
      position: fixed;
      top: 18px;
      right: 20px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 16, 30, 0.28);
      backdrop-filter: blur(10px);
      color: rgba(223, 233, 255, 0.7);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 720px) {
      .hud { left: 12px; right: 12px; bottom: 12px; max-width: none; }
      .hint { top: 10px; right: 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Janela cósmica interativa"></canvas>

  <div class="hint">mouse · subtle drift · arrows / wasd · q / e</div>
  <div class="hud">
    <strong>Cosmic Window</strong>
    <span>Uma janela calma para o universo. O rato desloca o olhar; as teclas movem e distorcem o cenário quase imperceptivelmente.</span>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false });

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        time: 0,
        last: performance.now(),
        camera: { x: 0, y: 0, zoom: 1, driftX: 0, driftY: 0 },
        target: { x: 0, y: 0, zoom: 1 },
        input: { left: false, right: false, up: false, down: false, slow: false, fast: false },
        mouse: { x: 0.5, y: 0.5, nx: 0, ny: 0 },
        assets: null,
      };

      const TAU = Math.PI * 2;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smoothstep(edge0, edge1, x) {
        const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function fract(x) {
        return x - Math.floor(x);
      }

      function hash2(ix, iy) {
        const s = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
        return fract(s);
      }

      function valueNoise(x, y) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;

        const a = hash2(xi, yi);
        const b = hash2(xi + 1, yi);
        const c = hash2(xi, yi + 1);
        const d = hash2(xi + 1, yi + 1);

        const u = xf * xf * (3 - 2 * xf);
        const v = yf * yf * (3 - 2 * yf);

        return lerp(lerp(a, b, u), lerp(c, d, u), v);
      }

      function fbm(x, y, octaves = 5) {
        let value = 0;
        let amp = 0.5;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i += 1) {
          value += valueNoise(x * freq, y * freq) * amp;
          norm += amp;
          amp *= 0.52;
          freq *= 2.03;
        }
        return value / norm;
      }

      function createCanvas(width, height) {
        const c = document.createElement('canvas');
        c.width = width;
        c.height = height;
        return c;
      }

      function createStarField(width, height, count, palette, sizeBias) {
        const c = createCanvas(width, height);
        const g = c.getContext('2d');
        g.clearRect(0, 0, width, height);

        for (let i = 0; i < count; i += 1) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const r = Math.pow(Math.random(), sizeBias) * 1.8 + 0.18;
          const a = 0.12 + Math.random() * 0.8;
          const tone = palette[Math.floor(Math.random() * palette.length)];

          g.globalAlpha = a;
          const grad = g.createRadialGradient(x, y, 0, x, y, r * 7);
          grad.addColorStop(0, tone.core);
          grad.addColorStop(0.25, tone.mid);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = grad;
          g.beginPath();
          g.arc(x, y, r * 7, 0, TAU);
          g.fill();

          g.globalAlpha = a * 0.85;
          g.fillStyle = tone.point;
          g.beginPath();
          g.arc(x, y, r, 0, TAU);
          g.fill();

          if (r > 1.15 && Math.random() > 0.68) {
            g.globalAlpha = a * 0.15;
            g.strokeStyle = tone.mid;
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(x - r * 6, y);
            g.lineTo(x + r * 6, y);
            g.moveTo(x, y - r * 6);
            g.lineTo(x, y + r * 6);
            g.stroke();
          }
        }

        g.globalAlpha = 1;
        return c;
      }

      function createNebulaTexture(width, height, hueA, hueB) {
        const c = createCanvas(width, height);
        const g = c.getContext('2d');
        const img = g.createImageData(width, height);
        const data = img.data;

        function colorMix(t) {
          const a = hueA;
          const b = hueB;
          return {
            r: Math.round(lerp(a.r, b.r, t)),
            g: Math.round(lerp(a.g, b.g, t)),
            b: Math.round(lerp(a.b, b.b, t)),
          };
        }

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const nx = x / width;
            const ny = y / height;
            const base = fbm(nx * 2.4 + 1.2, ny * 2.0 + 3.7, 6);
            const detail = fbm(nx * 6.5 + 6.1, ny * 6.1 + 8.3, 4);
            const wisps = fbm(nx * 10.5 + 2.4, ny * 9.4 + 5.2, 3);
            const density = Math.pow(clamp(base * 0.9 + detail * 0.45 - 0.34, 0, 1), 1.8);
            const accent = Math.pow(clamp(wisps - 0.45, 0, 1), 1.4);
            const tint = colorMix(clamp(base * 0.95 + detail * 0.25, 0, 1));
            const alpha = clamp(density * 175 + accent * 65, 0, 210);
            const i = (y * width + x) * 4;
            data[i + 0] = Math.min(255, tint.r + accent * 35);
            data[i + 1] = Math.min(255, tint.g + accent * 22);
            data[i + 2] = Math.min(255, tint.b + accent * 42);
            data[i + 3] = alpha;
          }
        }

        g.putImageData(img, 0, 0);
        return c;
      }

      function createDustTexture(width, height, count) {
        const c = createCanvas(width, height);
        const g = c.getContext('2d');
        for (let i = 0; i < count; i += 1) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const r = 0.6 + Math.random() * 1.2;
          const grad = g.createRadialGradient(x, y, 0, x, y, r * 8);
          const alpha = 0.02 + Math.random() * 0.05;
          grad.addColorStop(0, `rgba(180, 205, 255, ${alpha})`);
          grad.addColorStop(1, 'rgba(180, 205, 255, 0)');
          g.fillStyle = grad;
          g.beginPath();
          g.arc(x, y, r * 8, 0, TAU);
          g.fill();
        }
        return c;
      }

      function createPlanetTexture(size, palette, banding = true) {
        const c = createCanvas(size, size);
        const g = c.getContext('2d');
        const radius = size * 0.5;
        const cx = radius;
        const cy = radius;

        g.clearRect(0, 0, size, size);

        const planet = g.createRadialGradient(cx - radius * 0.22, cy - radius * 0.25, radius * 0.12, cx, cy, radius);
        planet.addColorStop(0, palette.highlight);
        planet.addColorStop(0.35, palette.mid);
        planet.addColorStop(0.72, palette.deep);
        planet.addColorStop(1, palette.shadow);

        g.fillStyle = planet;
        g.beginPath();
        g.arc(cx, cy, radius * 0.94, 0, TAU);
        g.fill();

        if (banding) {
          g.save();
          g.beginPath();
          g.arc(cx, cy, radius * 0.94, 0, TAU);
          g.clip();
          for (let y = -radius; y < radius; y += 8) {
            const t = (y + radius) / (radius * 2);
            const wisp = fbm(t * 6.2 + 0.5, t * 2.1 + 3.2, 4);
            const alpha = 0.04 + wisp * 0.085;
            g.fillStyle = `rgba(255,255,255,${alpha.toFixed(4)})`;
            g.fillRect(0, cy + y + Math.sin(t * 18) * 2.5, size, 4);
          }

          g.globalCompositeOperation = 'multiply';
          for (let y = -radius; y < radius; y += 11) {
            const t = (y + radius) / (radius * 2);
            const noise = fbm(t * 5.1 + 4.4, t * 2.9 + 1.1, 4);
            const alpha = 0.03 + noise * 0.09;
            g.fillStyle = `rgba(22,28,48,${alpha.toFixed(4)})`;
            g.fillRect(0, cy + y + Math.cos(t * 11) * 1.5, size, 5);
          }
          g.restore();
        }

        g.save();
        g.beginPath();
        g.arc(cx, cy, radius * 0.94, 0, TAU);
        g.clip();

        const atmosphere = g.createRadialGradient(cx - radius * 0.15, cy - radius * 0.25, radius * 0.32, cx, cy, radius);
        atmosphere.addColorStop(0, 'rgba(255,255,255,0.12)');
        atmosphere.addColorStop(0.5, 'rgba(170, 205, 255, 0.04)');
        atmosphere.addColorStop(1, 'rgba(0,0,0,0.26)');
        g.fillStyle = atmosphere;
        g.fillRect(0, 0, size, size);

        g.globalCompositeOperation = 'screen';
        const glow = g.createRadialGradient(cx - radius * 0.3, cy - radius * 0.38, radius * 0.05, cx - radius * 0.18, cy - radius * 0.2, radius * 0.9);
        glow.addColorStop(0, 'rgba(255,255,255,0.25)');
        glow.addColorStop(0.42, 'rgba(210,225,255,0.08)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = glow;
        g.fillRect(0, 0, size, size);
        g.restore();

        return c;
      }

      function createMoonTexture(size) {
        const c = createCanvas(size, size);
        const g = c.getContext('2d');
        const r = size * 0.5;
        const cx = r;
        const cy = r;

        const base = g.createRadialGradient(cx - r * 0.25, cy - r * 0.25, r * 0.06, cx, cy, r);
        base.addColorStop(0, 'rgba(240, 242, 246, 1)');
        base.addColorStop(0.42, 'rgba(168, 176, 190, 1)');
        base.addColorStop(0.82, 'rgba(84, 90, 102, 1)');
        base.addColorStop(1, 'rgba(36, 40, 50, 1)');
        g.fillStyle = base;
        g.beginPath();
        g.arc(cx, cy, r * 0.94, 0, TAU);
        g.fill();

        g.save();
        g.beginPath();
        g.arc(cx, cy, r * 0.94, 0, TAU);
        g.clip();
        for (let i = 0; i < 26; i += 1) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const cr = 2 + Math.random() * 14;
          g.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`;
          g.beginPath();
          g.arc(x, y, cr, 0, TAU);
          g.fill();
          g.strokeStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.06})`;
          g.lineWidth = 1;
          g.beginPath();
          g.arc(x - cr * 0.15, y - cr * 0.15, cr * 0.68, 0, TAU);
          g.stroke();
        }
        g.restore();
        return c;
      }

      function buildAssets() {
        const starPalette = [
          { core: 'rgba(255,255,255,1)', mid: 'rgba(216,230,255,0.28)', point: 'rgba(255,255,255,0.95)' },
          { core: 'rgba(255,246,224,1)', mid: 'rgba(255,224,182,0.26)', point: 'rgba(255,245,230,0.92)' },
          { core: 'rgba(220,234,255,1)', mid: 'rgba(160,196,255,0.24)', point: 'rgba(220,234,255,0.92)' },
        ];

        return {
          starsFar: createStarField(2200, 1200, 1100, starPalette, 6),
          starsMid: createStarField(2200, 1200, 420, starPalette, 3.4),
          starsNear: createStarField(2200, 1200, 130, starPalette, 1.2),
          nebulaA: createNebulaTexture(900, 520, { r: 74, g: 104, b: 196 }, { r: 160, g: 116, b: 230 }),
          nebulaB: createNebulaTexture(760, 460, { r: 62, g: 142, b: 205 }, { r: 129, g: 185, b: 255 }),
          dust: createDustTexture(1800, 1000, 280),
          planetLarge: createPlanetTexture(760, {
            highlight: 'rgba(210, 224, 255, 1)',
            mid: 'rgba(74, 110, 176, 1)',
            deep: 'rgba(30, 48, 94, 1)',
            shadow: 'rgba(8, 12, 24, 1)',
          }, true),
          planetSmall: createPlanetTexture(240, {
            highlight: 'rgba(255, 231, 193, 1)',
            mid: 'rgba(168, 120, 80, 1)',
            deep: 'rgba(92, 60, 40, 1)',
            shadow: 'rgba(26, 18, 14, 1)',
          }, false),
          moon: createMoonTexture(180),
        };
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = Math.floor(window.innerWidth);
        state.height = Math.floor(window.innerHeight);
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function drawLayer(image, speedX, speedY, alpha, scale = 1) {
        const w = image.width * scale;
        const h = image.height * scale;
        const ox = ((state.camera.x * speedX) % w + w) % w;
        const oy = ((state.camera.y * speedY) % h + h) % h;

        ctx.save();
        ctx.globalAlpha = alpha;
        for (let x = -ox - w; x < state.width + w; x += w) {
          for (let y = -oy - h; y < state.height + h; y += h) {
            ctx.drawImage(image, x, y, w, h);
          }
        }
        ctx.restore();
      }

      function drawNebula(image, x, y, w, h, alpha, rotation, blur = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.globalAlpha = alpha;
        if (blur) ctx.filter = `blur(${blur}px)`;
        ctx.drawImage(image, -w / 2, -h / 2, w, h);
        ctx.restore();
        ctx.filter = 'none';
      }

      function drawPlanet(image, x, y, radius, alpha = 1) {
        const size = radius * 2;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = 'rgba(100, 150, 255, 0.08)';
        ctx.shadowBlur = radius * 0.38;
        ctx.drawImage(image, x - radius, y - radius, size, size);
        ctx.restore();
      }

      function drawGlow(x, y, radius, color, alpha) {
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, color.replace('ALPHA', alpha.toFixed(3)));
        grad.addColorStop(1, color.replace('ALPHA', '0'));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fill();
      }

      function update(dt) {
        const drift = 0.06;
        state.target.x = state.mouse.nx * 34;
        state.target.y = state.mouse.ny * 22;

        if (state.input.left) state.target.x -= 28;
        if (state.input.right) state.target.x += 28;
        if (state.input.up) state.target.y -= 20;
        if (state.input.down) state.target.y += 20;
        if (state.input.slow) state.target.zoom = 0.985;
        else if (state.input.fast) state.target.zoom = 1.018;
        else state.target.zoom = 1;

        state.camera.driftX += dt * drift;
        state.camera.driftY += dt * drift * 0.38;

        state.camera.x = lerp(state.camera.x, state.target.x + state.camera.driftX, 1 - Math.exp(-dt * 0.7));
        state.camera.y = lerp(state.camera.y, state.target.y + state.camera.driftY, 1 - Math.exp(-dt * 0.7));
        state.camera.zoom = lerp(state.camera.zoom, state.target.zoom, 1 - Math.exp(-dt * 0.8));

        state.time += dt;
      }

      function renderBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
        gradient.addColorStop(0, '#02040a');
        gradient.addColorStop(0.35, '#050913');
        gradient.addColorStop(1, '#03050b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);

        drawGlow(state.width * 0.16, state.height * 0.18, state.width * 0.28, 'rgba(90,120,255,ALPHA)', 0.055);
        drawGlow(state.width * 0.78, state.height * 0.1, state.width * 0.22, 'rgba(130,170,255,ALPHA)', 0.035);
        drawGlow(state.width * 0.7, state.height * 0.76, state.width * 0.18, 'rgba(100,160,255,ALPHA)', 0.028);
      }

      function renderUniverse() {
        const a = state.assets;
        const t = state.time;
        const subtle = Math.sin(t * 0.07) * 0.5 + 0.5;
        const zoom = state.camera.zoom;

        ctx.save();
        ctx.translate(state.width / 2, state.height / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-state.width / 2, -state.height / 2);

        drawLayer(a.starsFar, 0.16, 0.08, 0.82);
        drawLayer(a.dust, 0.1, 0.06, 0.45);

        ctx.globalCompositeOperation = 'screen';
        drawNebula(
          a.nebulaA,
          state.width * 0.64 - state.camera.x * 0.18,
          state.height * 0.36 - state.camera.y * 0.14,
          state.width * 0.78,
          state.height * 0.72,
          0.26 + subtle * 0.03,
          -0.22 + Math.sin(t * 0.03) * 0.01,
          8
        );
        drawNebula(
          a.nebulaB,
          state.width * 0.28 - state.camera.x * 0.14,
          state.height * 0.62 - state.camera.y * 0.1,
          state.width * 0.62,
          state.height * 0.58,
          0.16 + subtle * 0.02,
          0.18 - Math.cos(t * 0.025) * 0.01,
          12
        );
        ctx.globalCompositeOperation = 'source-over';

        drawLayer(a.starsMid, 0.34, 0.18, 0.78);

        const planetX = state.width * 0.76 - state.camera.x * 0.42 + Math.sin(t * 0.04) * 8;
        const planetY = state.height * 0.28 - state.camera.y * 0.24 + Math.cos(t * 0.05) * 6;
        drawGlow(planetX, planetY, 240, 'rgba(104,146,255,ALPHA)', 0.065);
        drawPlanet(a.planetLarge, planetX, planetY, Math.min(state.width, state.height) * 0.28, 0.98);

        const moonX = state.width * 0.3 - state.camera.x * 0.68 + Math.cos(t * 0.13) * 12;
        const moonY = state.height * 0.33 - state.camera.y * 0.42 + Math.sin(t * 0.11) * 8;
        drawGlow(moonX, moonY, 70, 'rgba(255,255,255,ALPHA)', 0.04);
        drawPlanet(a.moon, moonX, moonY, Math.min(state.width, state.height) * 0.062, 0.92);

        const planet2X = state.width * 0.18 - state.camera.x * 0.85 + Math.sin(t * 0.09) * 6;
        const planet2Y = state.height * 0.78 - state.camera.y * 0.54 + Math.cos(t * 0.075) * 5;
        drawGlow(planet2X, planet2Y, 90, 'rgba(255,205,160,ALPHA)', 0.05);
        drawPlanet(a.planetSmall, planet2X, planet2Y, Math.min(state.width, state.height) * 0.078, 0.9);

        drawLayer(a.starsNear, 0.52, 0.3, 0.92);
        ctx.restore();
      }

      function renderTransientEffects() {
        const t = state.time;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = 0.08;
        for (let i = 0; i < 3; i += 1) {
          const x = state.width * (0.18 + i * 0.29) + Math.sin(t * (0.08 + i * 0.015)) * 40;
          const y = state.height * (0.22 + i * 0.2) + Math.cos(t * (0.06 + i * 0.011)) * 26;
          const r = 0.9 + (Math.sin(t * (0.8 + i * 0.26)) * 0.5 + 0.5) * 2.1;
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        const vignette = ctx.createRadialGradient(
          state.width * 0.5,
          state.height * 0.5,
          state.height * 0.12,
          state.width * 0.5,
          state.height * 0.5,
          state.width * 0.7
        );
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(0.72, 'rgba(0,0,0,0.12)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, state.width, state.height);

        const cursorGlow = ctx.createRadialGradient(state.mouse.x, state.mouse.y, 0, state.mouse.x, state.mouse.y, 85);
        cursorGlow.addColorStop(0, 'rgba(180, 205, 255, 0.035)');
        cursorGlow.addColorStop(1, 'rgba(180, 205, 255, 0)');
        ctx.fillStyle = cursorGlow;
        ctx.beginPath();
        ctx.arc(state.mouse.x, state.mouse.y, 85, 0, TAU);
        ctx.fill();
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - state.last) / 1000);
        state.last = now;
        update(dt);
        renderBackground();
        renderUniverse();
        renderTransientEffects();
        requestAnimationFrame(frame);
      }

      function onPointerMove(event) {
        state.mouse.x = event.clientX;
        state.mouse.y = event.clientY;
        state.mouse.nx = (event.clientX / state.width - 0.5) * 2;
        state.mouse.ny = (event.clientY / state.height - 0.5) * 2;
      }

      function setKey(event, isDown) {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') state.input.left = isDown;
        if (key === 'arrowright' || key === 'd') state.input.right = isDown;
        if (key === 'arrowup' || key === 'w') state.input.up = isDown;
        if (key === 'arrowdown' || key === 's') state.input.down = isDown;
        if (key === 'q') state.input.slow = isDown;
        if (key === 'e') state.input.fast = isDown;
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('keydown', (event) => setKey(event, true));
      window.addEventListener('keyup', (event) => setKey(event, false));

      state.assets = buildAssets();
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
